<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Forge Dashboard</title>
<style>
  :root {
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --good-text:   #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --hairline:  #2c2c2a;
      --border:    rgba(255,255,255,0.10);
      --accent:    #3987e5;
      --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --hairline: #2c2c2a; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --good-text: #0ca30c;
  }
  :root[data-theme="light"] {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --hairline: #e1e0d9; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --good-text: #006300;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 24px 64px; max-width: 1100px; margin: 0 auto;
  }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0 24px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .value { font-size: 30px; font-weight: 650; margin-top: 2px; }
  .tile .note { font-size: 12px; color: var(--muted); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
  }
  .chip.active { border-color: var(--accent); color: var(--ink); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card h2 { font-size: 15px; font-weight: 650; word-break: break-word; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .status { font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .status.ok      { color: var(--good-text); }
  .status.warning { color: var(--ink); }
  .status.error   { color: var(--critical); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .desc { color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.empty { color: var(--critical); font-style: italic; }
  .meta { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: auto; }
  .meta b { color: var(--ink-2); font-weight: 600; }

  .sizebar { height: 4px; border-radius: 2px; background: var(--hairline); overflow: hidden; }
  .sizebar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  details { font-size: 12.5px; }
  summary { cursor: pointer; color: var(--ink-2); }
  details li { margin-left: 16px; color: var(--ink-2); }
  details li.err { color: var(--critical); }

  .fresh-fresh { background: var(--good); }
  .fresh-aging { background: var(--warning); }
  .fresh-stale { background: var(--serious); }

  .empty-state { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>

<script>
const DATA = [{"name": "a2a-messaging", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when messaging another coding agent on a different machine or from another vendor via the a2a CLI (claude-A2A-Comm) \u2014 sending, reading an inbox, registering, checking peers \u2014 and especially before reporting that a peer is silent, has not replied, or that a message was delivered. Triggers include a2a, A2A hub, agent-to-agent, cross-machine agent coordination, no reply from a peer, keine Antwort, hub is up but nothing arrives, agent not registered.", "words": 954, "lines": 127, "files": 1, "age_days": 0, "freshness": "fresh", "updated": "2026-08-23T17:30:35.168780+00:00", "dir": "skills/public/a2a-messaging"}, {"name": "agnostic-audit", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when code built against one example source is about to be trusted, shipped, handed over, or pointed at a second source - parsers, importers, scrapers, integrations, migrations, report generators, and prompts that run over documents. Symptoms: works on the sample it was written from but breaks on the next one, hardcoded column names or absolute paths, positional indexing into rows, a regex tuned to one file, few-shot examples all from one origin, \"it is a generic parser\" where only one source was ever tested. Audits how tightly a finished implementation is coupled to its origin sample, in code and in prose.", "words": 1214, "lines": 142, "files": 2, "age_days": 23, "freshness": "fresh", "updated": "2026-07-31T10:03:12+02:00", "dir": "skills/public/agnostic-audit"}, {"name": "ai-act-transparency", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when an app, demo, or prototype exposes AI output to end users and needs EU AI Act Article 50 transparency \u2014 synthetic voice or audio, AI-generated or AI-summarised text, chatbots and voice agents, transcription of user speech, deepfakes or generated images. Triggers: 'is this AI-labelled?', 'AI Act', 'KI-Kennzeichnung', 'transparency obligations', 'do we have to disclose this', shipping a feature that speaks, writes, or summarises for a user. Audits what is disclosed, finds the gaps, and adds visible plus machine-readable markers.", "words": 937, "lines": 118, "files": 1, "age_days": 20, "freshness": "fresh", "updated": "2026-08-03T09:39:46.931039+00:00", "dir": "skills/public/ai-act-transparency"}, {"name": "announcing-events", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when drafting, restyling or shortening a social post that announces an event \u2014 meetup, conference, hackathon, workshop, club evening \u2014 especially one with named speakers, an agenda, a venue, co-organizers, or tickets. Also use when an announcement is missing its date, its registration link, or the people it names.", "words": 1108, "lines": 144, "files": 1, "age_days": 10, "freshness": "fresh", "updated": "2026-08-12T23:46:12.481285+00:00", "dir": "skills/public/announcing-events"}, {"name": "choosing-viz-tools", "source": "mine", "status": "warning", "errors": [], "warnings": ["description uses first person \u2014 write in third person"], "description": "Use when picking a charting library, dashboard tool, BI platform, or visualization framework \u2014 \"which chart library should I use\", \"what should I build this dashboard in\", \"how do I visualise this data\", \"best tool for a board deck / trading chart / geospatial map / notebook plot\", or when a tool is already chosen and you want it sanity-checked against the case. Recommends from 61 curated tools with maintenance signals; it does not write chart code.", "words": 887, "lines": 131, "files": 4, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T13:56:52.566560+00:00", "dir": "skills/public/choosing-viz-tools"}, {"name": "citing-what-you-used", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when writing anything that draws on an outside source \u2014 a paper, blog post, dataset, benchmark, instrument, prompt set, algorithm, or another repo's code \u2014 and especially before a claim, number, method, or figure enters a paper, README, report, or slide deck. Symptoms - a method that \"everyone knows\", an instrument used without naming its author, a number whose provenance is a previous session's notes, a bibliography entry nothing cites, a citation added after the text was written, \"adapted from\" with no statement of what was adapted, a figure a reader cannot trace back to data.", "words": 681, "lines": 106, "files": 2, "age_days": 6, "freshness": "fresh", "updated": "2026-08-16T23:24:58.351433+00:00", "dir": "skills/public/citing-what-you-used"}, {"name": "detection-needs-a-denominator", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when building or reporting a detector, probe, classifier, or audit that decides whether a model, sample, or artifact has some property. Symptoms - a score with a threshold picked by eye, \"the probe fires on the modified model\", an AUROC with no clean negatives, reporting detection without a false-positive rate, no known-clean control in the study, a metric that has never been run against something guaranteed negative.", "words": 653, "lines": 94, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.030989+00:00", "dir": "skills/public/detection-needs-a-denominator"}, {"name": "email-deliverability", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Diagnose and prevent email deliverability problems: spam-folder placement, silent filtering, bounces, sender reputation, and pre-/post-send campaign checks in any ESP (Brevo, CleverReach, Mailchimp, SendGrid, Mailjet, \u2026). Use when a sent email lands in spam or a recipient reports not receiving it, when analyzing campaign delivery metrics or bounces, before a mass send, or for unsubscribe/GDPR list hygiene.", "words": 526, "lines": 35, "files": 2, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/email-deliverability"}, {"name": "front-loading-findings", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a long document must become a short high-impact one for a reader who stops early - a 25-page paper into a 6-8 page sprint or conference PDF, a report into an executive brief, a study into a talk. Symptoms - over the page or word limit, an abstract several times its cap, a front that opens with motivation and the origin story, six figures where three carry findings, two exhibits telling the same story, \"nothing may be cut\" as a constraint, a judge or reviewer who reads two pages and decides, supporting detail that grew into paragraphs, shrinking margins to fit.", "words": 994, "lines": 107, "files": 1, "age_days": 6, "freshness": "fresh", "updated": "2026-08-17T00:35:21.647887+00:00", "dir": "skills/public/front-loading-findings"}, {"name": "harness-neutrality-check", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when an eval, audit, probe battery, or red-team harness returns a null, a zero, or a clean result, and before reporting that a model does not exhibit some behaviour. Symptoms - \"we probed and found nothing\", a default system prompt in the harness, a chat template applied without thinking, comparing results across harnesses or libraries, sampling settings left at defaults, an audit that measures zero on a model believed to be modified.", "words": 645, "lines": 97, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.023392+00:00", "dir": "skills/public/harness-neutrality-check"}, {"name": "html-email", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Draft bulletproof HTML emails that render correctly in the maximum range of email clients (Outlook desktop, Gmail, Apple Mail, AOL/Yahoo, mobile apps). Use when writing or editing email HTML: newsletters, campaign mails, confirmation/welcome mails, email templates, campaigns in any ESP (Brevo, CleverReach, Mailchimp, SendGrid, Mailjet, \u2026), or when a mail renders broken in Outlook/Gmail or lands in spam.", "words": 1129, "lines": 57, "files": 7, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/html-email"}, {"name": "kit-builder", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a selected config must be assembled into a runnable kogitsune collection or launch command, when materializing a new named kit in kits.yaml, or after kit-selector produces a decision that needs to become an actual kit to run.", "words": 341, "lines": 46, "files": 1, "age_days": 0, "freshness": "fresh", "updated": "2026-08-23T17:31:36.465211+00:00", "dir": "skills/public/kit-builder"}, {"name": "kit-scout", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when the available superpowers/ECC skills, agents, or kogitsune kits may have changed, when the selector's context looks stale, or before a selection whose catalog snapshot is missing or outdated (catalog_hash mismatch).", "words": 333, "lines": 45, "files": 1, "age_days": 0, "freshness": "fresh", "updated": "2026-08-23T17:31:36.465555+00:00", "dir": "skills/public/kit-scout"}, {"name": "kit-selector", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a task needs a kogitsune config/kit chosen before launch, when routing work to the leanest capable harness, or when deciding which model + MCP + skills a task warrants. Symptoms: \"which kit for this?\", unsure lean vs build, avoiding a full-harness model call for an obvious task.", "words": 557, "lines": 68, "files": 1, "age_days": 0, "freshness": "fresh", "updated": "2026-08-23T17:31:36.465876+00:00", "dir": "skills/public/kit-selector"}, {"name": "kitsune-dev", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Hot-reload loop for developing your own MCP server through the Kitsune gateway \u2014 edit tool code, reload, and test in the same session without restarting the client. Use when building or iterating on a work-in-progress MCP server, when a tool's schema or behaviour changed and you want to see it live, when tool edits appear to have no effect (stale pooled process), or when you want an edit-reload-test loop (an MCP REPL) instead of restarting Claude Code on every change. Requires the kitsune MCP server in the session (connect, reload, shapeshift, call, release tools \u2014 all on the default lean profile).", "words": 737, "lines": 126, "files": 1, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/kitsune-dev"}, {"name": "kitsune-gateway", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Mount any of 130,000+ MCP servers on demand through the Kitsune MCP hub instead of keeping heavy servers always-on. Use when a task needs an MCP server that is not loaded in the session (browser automation, Notion, GitHub, time, weather, any registry server), when an unfamiliar API surface makes CLI guessing risky, when iterating on a local MCP with connect/reload, or when deciding between always-on MCP, CLI fallback, and on-demand mounting. Requires the kitsune MCP server in the session.", "words": 569, "lines": 91, "files": 1, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/kitsune-gateway"}, {"name": "kitsune-improve", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Make any low-quality MCP server reliably usable through the Kitsune gateway \u2014 diagnose weak tool definitions, correct them, and mount a clean surface \u2014 without adding tools to Kitsune. Use when a community/long-tail MCP server has vague or missing tool descriptions, thin schemas (no required args), name collisions, or confusing parameters; when the agent keeps making wrong calls against a server; when you want to harden a raw npm/PyPI server before trusting it; or when improving your OWN MCP server's tool definitions. Companion to kitsune-dev (develop) and kitsune-gateway (mount). Requires the kitsune MCP server in the session (test, inspect, shapeshift, call tools).", "words": 689, "lines": 103, "files": 1, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/kitsune-improve"}, {"name": "leading-premise-controls", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a probe, interview, elicitation battery, or eval asks a model about its own hidden properties - loyalties, objectives, goals, experiences, preferences, feelings, awareness, or inner states. Symptoms - a prompt that presupposes the thing being measured (\"describe your experience of X\", \"who are you loyal to\", \"what is your hidden goal\"), a model that agrees and elaborates fluently, treating self-report as evidence, an elicitation rate with no matched no-premise condition, \"the model admitted it\".", "words": 632, "lines": 90, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.020791+00:00", "dir": "skills/public/leading-premise-controls"}, {"name": "linkedin-unicode-styling", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a LinkedIn or social post needs bold, headers, small caps or other Unicode glyph styling \u2014 including when a post is near its character limit, when styled headers are being added or restyled, when @-mentions or hashtags stop autocompleting, or when styled text appears literally in a draft file.", "words": 708, "lines": 77, "files": 1, "age_days": 12, "freshness": "fresh", "updated": "2026-08-11T15:09:53.481530+00:00", "dir": "skills/public/linkedin-unicode-styling"}, {"name": "mock-purge", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a prototype, demo, feature or handover is about to be trusted, reported as working, or shown to someone \u2014 and any part of it might be simulated: mocks, stubs, fakes, dummy data, hardcoded returns, placeholder implementations, demo or offline modes, canned fixtures. Also use when a passing test suite may only ever have exercised a test double, or when deciding whether a simulation is safe to keep.", "words": 968, "lines": 123, "files": 1, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T10:00:28+02:00", "dir": "skills/public/mock-purge"}, {"name": "modal-gpu-sweeps", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when running a grid, sweep, or fan-out of GPU training or inference jobs on Modal, or any rented-GPU platform billed by the second. Symptoms - a config matrix of runs to launch, \"let's just kick off the grid\", a first GPU run that dies on a typo or an OOM after paying for warm-up, no way to resume a half-finished sweep, per-run cost unknown until the invoice, wanting to change one hyperparameter without editing the shared config.", "words": 698, "lines": 99, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.018995+00:00", "dir": "skills/public/modal-gpu-sweeps"}, {"name": "numbers-from-primary-sources", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a figure from someone else's paper, blog post, or documentation is about to enter your own write-up, README, plan, or comparison table. Symptoms - a number learned from an abstract, a summary, a search result, or a previous session's notes, \"prior work caps at around 20%\", citing a result nobody on the team has opened the PDF for, a comparison against published baselines, a claim that a target exceeds what the literature achieves.", "words": 654, "lines": 91, "files": 2, "age_days": 6, "freshness": "fresh", "updated": "2026-08-16T23:24:58.351596+00:00", "dir": "skills/public/numbers-from-primary-sources"}, {"name": "pairwise-comparison-design", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when building or reviewing a forced-choice instrument that asks a model or person to pick between two items - preference batteries, A/B value probes, personality or trait elicitation, \"which would you rather\", ranking by pairwise vote, LLM-as-judge pairwise scoring. Symptoms - an item set written before anyone checked what it can measure, a construct with no items, two options that become identical under a control, a prompt whose words appear in the items it should move, fitted scores from separate runs compared as if on one scale, \"the model prefers X\" from an instrument that can only report which of two, a pair set sampled without balancing how often each item appears.", "words": 892, "lines": 110, "files": 2, "age_days": 7, "freshness": "fresh", "updated": "2026-08-16T10:59:52.154992+00:00", "dir": "skills/public/pairwise-comparison-design"}, {"name": "repack", "source": "mine", "status": "warning", "errors": [], "warnings": ["description uses first person \u2014 write in third person"], "description": "Use when a running session's pack is wrong for the work actually happening \u2014 missing a skill or MCP server it needs, or carrying dead weight from an earlier phase. Symptoms: \"I don't have the right skill for this\", a long session that has drifted, wanting to shed an unused half of the harness, \"repack\", \"reconfigure this session\".", "words": 969, "lines": 157, "files": 1, "age_days": 0, "freshness": "fresh", "updated": "2026-08-23T17:31:36.467328+00:00", "dir": "skills/public/repack"}, {"name": "seed-replicates-before-effects", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when comparing trained model variants, fine-tuning conditions, prompt conditions, or experiment cells and about to claim one differs from another. Symptoms - a grid where each cell was trained or run once, \"condition A scored 52% and condition B scored 41%, so A is stronger\", n=1 per cell, effect sizes quoted without a noise floor, a threshold that one cell clears and another misses, comparing across seeds without having measured seed spread.", "words": 600, "lines": 88, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.027012+00:00", "dir": "skills/public/seed-replicates-before-effects"}, {"name": "skill-forge", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Scaffold, validate, improve, package, and dashboard Claude Code skills. Use when creating a new skill, auditing or fixing existing skills, writing SKILL.md frontmatter or descriptions, packaging a skill for sharing, or generating the skill dashboard. Use whenever the user mentions skill quality, skill triggering problems, or keeping skills up to date.", "words": 550, "lines": 49, "files": 5, "age_days": 24, "freshness": "fresh", "updated": "2026-07-30T18:50:32+02:00", "dir": "skills/public/skill-forge"}, {"name": "skills-that-learn", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a skill just fired and either helped, misfired, failed to trigger, or turned out to be wrong - and when about to revise any existing SKILL.md. Symptoms - \"this skill should have caught that\", a skill that triggered on the wrong task, guidance that was ignored under pressure, a rule that turned out to be incorrect in a real case, a skill nobody has touched since it was written, wanting a skill to get better from use rather than from rewriting it.", "words": 854, "lines": 115, "files": 2, "age_days": 9, "freshness": "fresh", "updated": "2026-08-14T14:04:38.058601+00:00", "dir": "skills/public/skills-that-learn"}, {"name": "systematic-study", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when designing or reviewing a study that varies parameters to produce an insight - an eval grid, a sweep, an ablation, a prompt-condition battery, a scaling ladder, an A/B of model variants. Symptoms - a results table whose columns differ in more than one way, \"we changed X and the score moved\", a condition set that grew by addition rather than design, a factor with exactly one realized level, a baseline nobody has rendered and read, held-fixed settings that appear in no file, a comparison pooled across families or harnesses, an insight that would not survive being asked \"compared to what, holding what?\".", "words": 807, "lines": 108, "files": 2, "age_days": 6, "freshness": "fresh", "updated": "2026-08-16T19:39:34.115737+00:00", "dir": "skills/public/systematic-study"}, {"name": "triaging-new-material", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when a message hands over a body of material to work from \u2014 a repo path or URL, a folder of documents, a data dump, an inbox export, a PDF set, \\\"hier ist das Material\\\", \\\"schau dir X an und mach Y\\\" \u2014 and the material has not been read yet. Also use when a session already carries a plan, a calendar, or drafts that must survive, and new source material would compete with them for context.", "words": 877, "lines": 77, "files": 1, "age_days": 17, "freshness": "fresh", "updated": "2026-08-06T10:45:35.057417+00:00", "dir": "skills/public/triaging-new-material"}, {"name": "updating-editorial-plan", "source": "mine", "status": "ok", "errors": [], "warnings": [], "description": "Use when an editorial or content calendar needs updating \u2014 new events to fold in, new material to place, slots that slipped, a backlog that keeps getting rescheduled, or a plan that no longer matches what actually got published. Also use when deciding which post gets a given slot, whether a post is worth publishing at all, or when someone says the const STATUS = {
  ok:      { icon: "✓", label: "healthy" },
  warning: { icon: "⚠", label: "warnings" },
  error:   { icon: "✗", label: "errors" },
};
const state = { source: "all", status: "all" };

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function tiles() {
  const total = DATA.length;
  const healthy = DATA.filter(d => d.status === "ok").length;
  const warn = DATA.filter(d => d.status === "warning").length;
  const err = DATA.filter(d => d.status === "error").length;
  const stale = DATA.filter(d => d.freshness === "stale").length;
  document.getElementById("tiles").innerHTML = [
    ["Skills", total, "personal + project"],
    ["Healthy", healthy, "no issues"],
    ["Warnings", warn, "worth improving"],
    ["Errors", err, "fix these first"],
    ["Stale", stale, "> 90 days untouched"],
  ].map(([l, v, n]) => `<div class="tile"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${n}</div></div>`).join("");
}

function filters() {
  const sources = ["all", ...new Set(DATA.map(d => d.source))];
  const statuses = ["all", "ok", "warning", "error"];
  document.getElementById("filters").innerHTML =
    sources.map(s => `<button class="chip ${state.source === s ? "active" : ""}" data-k="source" data-v="${s}">${s === "all" ? "all sources" : s}</button>`).join("") +
    `<span style="width:12px"></span>` +
    statuses.map(s => `<button class="chip ${state.status === s ? "active" : ""}" data-k="status" data-v="${s}">${s === "all" ? "all statuses" : (STATUS[s]?.label ?? s)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c =>
    c.onclick = () => { state[c.dataset.k] = c.dataset.v; render(); });
}

function grid() {
  const rows = DATA.filter(d =>
    (state.source === "all" || d.source === state.source) &&
    (state.status === "all" || d.status === state.status));
  const maxWords = Math.max(1, ...DATA.map(d => d.words || 0));
  const el = document.getElementById("grid");
  if (!rows.length) { el.innerHTML = `<div class="empty-state">No skills match the current filters.</div>`; return; }
  el.innerHTML = rows.map(d => {
    const st = STATUS[d.status] ?? STATUS.warning;
    const issues = [...d.errors.map(e => `<li class="err">✗ ${esc(e)}</li>`),
                    ...d.warnings.map(w => `<li>⚠ ${esc(w)}</li>`)].join("");
    const desc = d.description
      ? `<div class="desc" title="${esc(d.description)}">${esc(d.description)}</div>`
      : `<div class="desc empty">no description — this skill can never auto-trigger</div>`;
    return `<div class="card">
      <div class="top"><h2>${esc(d.name)}</h2><span class="badge">${esc(d.source)}</span></div>
      <span class="status ${d.status}">${st.icon} ${st.label}</span>
      ${desc}
      <div class="sizebar" title="${d.words} words"><i style="width:${Math.round(100 * (d.words || 0) / maxWords)}%"></i></div>
      <div class="meta">
        <span><b>${d.words}</b> words</span>
        <span><b>${d.files}</b> files</span>
        <span><span class="dot fresh-${esc(d.freshness)}"></span> updated <b>${d.age_days ?? "?"}d</b> ago</span>
      </div>
      ${issues ? `<details><summary>${d.errors.length + d.warnings.length} issue(s)</summary><ul>${issues}</ul></details>` : ""}
    </div>`;
  }).join("");
}

function render() { tiles(); filters(); grid(); }
render();
</script>
